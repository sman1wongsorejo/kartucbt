<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Cetak Kartu Ujian SMANJO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Tema Instagram */
      --primary: #E1306C;
      --bg-color: #FAFAFA;
      --card-bg: #FFFFFF;
      --text-main: #262626;
      --text-muted: #8E8E8E;
      --card-border: #DBDBDB;
      --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 0; /* Padding dipindah ke container masing-masing */
      color: var(--text-main);
    }

    /* =======================================================
       TAMPILAN LOGIN ADMIN DENGAN BACKGROUND LOGO & AMBIENT IG
       ======================================================= */
    #login-admin-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* Background Gambar Logo */
      background: url('https://i.ibb.co.com/7NrDzXdd/Red-And-White-Illustrative-Fish-Logo-20260609-231611-0000.png') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      position: relative;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Overlay Glassmorphism & Ambient Light Instagram */
    #login-admin-container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(250, 250, 250, 0.65); /* Layer putih transparan */
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(240, 148, 51, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(225, 48, 108, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(188, 24, 136, 0.25) 0%, transparent 50%);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 0;
    }

    .admin-card {
      background: rgba(255, 255, 255, 0.85); /* Semi transparan untuk efek kaca */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      text-align: left; 
      border: 1px solid rgba(219, 219, 219, 0.5);
      position: relative;
      z-index: 1; /* Di atas overlay background */
    }

    /* Pengaturan Logo Bagian Atas Form (Tengah & Diperkecil 25%) */
    .admin-card img { 
      width: 320px; 
      max-width: 100%; 
      margin: 0 auto 25px auto; /* auto untuk meratakan posisi ke tengah */
      display: block; 
    }

    .admin-card h2 { margin: 0 0 5px 0; font-weight: 700; color: var(--text-main); font-size: 24px; text-align: center; }
    .admin-card p { margin: 0 0 25px 0; color: var(--text-muted); font-size: 14px; font-weight: 400; text-align: center; }

    .input-group { text-align: left; margin-bottom: 20px; }
    .input-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-main); }
    .input-group input { 
      width: 100%; padding: 12px 16px; border: 1px solid var(--card-border); 
      border-radius: 6px; font-size: 14px; font-family: inherit; box-sizing: border-box;
      transition: all 0.2s ease; background: #FAFAFA;
    }
    .input-group input:focus { border-color: #A8A8A8; outline: none; background: #FFF;}

    .btn-login {
      background: var(--ig-gradient);
      color: #FFF; border: none; padding: 14px; width: 100%;
      border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
      transition: opacity 0.2s ease; 
    }
    .btn-login:hover:not(:disabled) { opacity: 0.9; }
    .btn-login:disabled { opacity: 0.7; cursor: wait; }

    #pesan-error { color: var(--danger); font-size: 13px; font-weight: 500; margin-top: 15px; display: none; background: transparent; padding: 0; text-align: center; }

    /* =======================================================
       TAMPILAN KONTROL & CETAK KARTU (Sembunyi Diawal)
       ======================================================= */
    #app-container { 
      display: none; 
      padding: 20px;
    }

    .control-panel {
      max-width: 800px; margin: 0 auto 30px auto;
      background: var(--card-bg); padding: 25px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      text-align: center; border: 1px solid var(--card-border);
    }
    .control-panel h2 { margin-top: 0; color: var(--text-main); font-weight: 600;}
    
    .btn-print {
      background: #0095F6; color: #FFF; border: none; padding: 12px 24px;
      border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
      transition: 0.2s; margin-top: 10px;
    }
    .btn-print:hover { opacity: 0.9; }
    
    .btn-logout {
      background: transparent; color: var(--text-main); border: 1px solid var(--card-border); padding: 11px 20px;
      border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
      margin-left: 10px; transition: 0.2s;
    }
    .btn-logout:hover { background: #FAFAFA; border-color: #A8A8A8;}

    /* =======================================================
       PENGATURAN KERTAS A4 & KARTU (TAMPILAN PRINT)
       ======================================================= */
    @page { size: A4 portrait; margin: 10mm; }

    .a4-page {
      width: 190mm; height: 277mm; margin: 0 auto 20mm auto; background: #FFF;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, 1fr); 
      gap: 5mm; box-sizing: border-box; page-break-after: always; box-shadow: 0 0 15px rgba(0,0,0,0.05);
      color: #1E293B; /* Hardcode untuk cetak hitam/gelap optimal */
    }

    .kartu { border: 1px dashed #64748B; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; justify-content: flex-start; background: #FFF; }
    .kartu-header { display: flex; align-items: center; border-bottom: 2px solid #1E293B; padding-bottom: 6px; margin-bottom: 8px; }
    .kartu-logo { width: 45px; height: auto; margin-right: 10px; }
    
    .kop-sekolah { flex: 1; text-align: center; line-height: 1.2; }
    .kop-1 { font-size: 8px; font-weight: 600; text-transform: uppercase; }
    .kop-2 { font-size: 11px; font-weight: 800; letter-spacing: 0.5px; margin: 2px 0; }
    .kop-3 { font-size: 9px; font-weight: 700; background: #1E293B; color: #FFF; display: inline-block; padding: 2px 8px; border-radius: 10px; }

    .kartu-body table { width: 100%; font-size: 10px; border-collapse: collapse; }
    .kartu-body td { padding: 4px 0; vertical-align: top; }
    .kartu-body td:nth-child(1) { width: 35%; font-weight: 600; }
    .kartu-body td:nth-child(2) { width: 5%; text-align: center; }
    .kartu-body td:nth-child(3) { width: 60%; font-weight: 800; font-size: 11px; }

    .box-password { background: #F1F5F9; border: 1px solid #1E293B; padding: 2px 5px; font-family: monospace; font-size: 12px !important; display: inline-block; letter-spacing: 1px; }
    .catatan { margin-top: auto; font-size: 7px; text-align: center; font-style: italic; border-top: 1px dotted #94A3B8; padding-top: 4px; color: #475569; }

    @media print {
      body { background: #FFF; padding: 0; }
      #app-container { padding: 0; }
      .control-panel, #login-admin-container { display: none !important; } 
      .a4-page { box-shadow: none; margin: 0; border: none; }
      .kartu { border: 1px solid #000; } 
    }
  </style>
</head>
<body>

  <div id="login-admin-container">
    <div class="admin-card">
      <img src="https://i.ibb.co.com/7NrDzXdd/Red-And-White-Illustrative-Fish-Logo-20260609-231611-0000.png" alt="Logo Aplikasi">
      
      <h2>CETAK KARTU CBT</h2>
      <p>Akses Khusus Admin SMANJO</p>
      
      <!-- Input Username Admin -->
      <div class="input-group">
        <label>Username Admin</label>
        <input type="text" id="adminUser" placeholder="Masukkan username admin" onkeypress="handleEnter(event)">
      </div>

      <!-- Input Password Admin -->
      <div class="input-group">
        <label>Password Admin</label>
        <input type="password" id="adminPass" placeholder="Masukkan password admin" onkeypress="handleEnter(event)">
      </div>
      
      <button class="btn-login" id="btnLoginAdmin" onclick="loginAdmin()">Login Admin</button>
      <div id="pesan-error"></div>
    </div>
  </div>

  <div id="app-container">
    <div class="control-panel no-print">
      <h2>🖨️ Cetak Kartu Peserta Ujian</h2>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Data berhasil ditarik. Silakan cetak pada kertas ukuran A4.</p>
      <button class="btn-print" onclick="window.print()">Cetak Kartu Sekarang</button>
      <button class="btn-logout" onclick="location.reload()">Kunci & Keluar</button>
    </div>

    <div id="print-area"></div>
  </div>

  <script>
    // ==========================================
    // MASUKKAN URL WEB APP GAS ANDA DI SINI
    // ==========================================
    const URL_API_GAS = "https://script.google.com/macros/s/AKfycbyGi8A3MIDN-aOLnPfBbupq-Xv74shn4W5_i5NnWPlr6ww5rJbUFefngSuXe7tHxROy/exec";
    
    // Logo asli yang dirender di kertas cetak (ukuran kecil dalam tabel) tidak diubah
    const LOGO_URL = "https://i.ibb.co.com/zTHpGJ3W/20260513-105333-0000.png";

    // Fungsi agar bisa menekan Enter saat mengetik input
    function handleEnter(e) {
      if(e.key === 'Enter') { loginAdmin(); }
    }

    function loginAdmin() {
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value.trim();
      const errBox = document.getElementById('pesan-error');

      if(!user || !pass) {
        errBox.innerText = "Username dan Password wajib diisi!";
        errBox.style.display = "block";
        return;
      }

      const btn = document.getElementById('btnLoginAdmin');
      
      btn.disabled = true;
      btn.innerText = "Memeriksa Login...";
      errBox.style.display = "none";

      fetch(URL_API_GAS, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ 
          action: "getDaftarSiswa",
          usernameAdmin: user,  // Mengirim username untuk dicek di backend
          passwordAdmin: pass   // Mengirim password untuk dicek di backend
        })
      })
      .then(res => res.json())
      .then(data => {
        if(data.error) {
           errBox.innerText = data.error;
           errBox.style.display = "block";
           btn.disabled = false;
           btn.innerText = "Login Admin";
           return;
        }
        
        // Jika berhasil, render kartu dan sembunyikan layar login
        renderKartu(data);
        document.getElementById('login-admin-container').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
      })
      .catch(err => {
        errBox.innerText = "Terjadi Kesalahan Koneksi Server.";
        errBox.style.display = "block";
        btn.disabled = false;
        btn.innerText = "Login Admin";
      });
    }

    function chunkArray(arr, size) {
      const result = [];
      for (let i = 0; i < arr.length; i += size) {
        result.push(arr.slice(i, i + size));
      }
      return result;
    }

    function renderKartu(daftarSiswa) {
      const printArea = document.getElementById('print-area');
      printArea.innerHTML = ''; 
      
      const halamanData = chunkArray(daftarSiswa, 10);

      halamanData.forEach((siswaPerHalaman) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'a4-page';
        
        siswaPerHalaman.forEach(siswa => {
          let namaTampil = siswa.nama;
          if(namaTampil.length > 25) { namaTampil = namaTampil.substring(0, 25) + "..."; }

          const kartuHTML = `
            <div class="kartu">
              <div class="kartu-header">
                <div class="kop-sekolah">
                  <div class="kop-1">Pemerintah Provinsi Jawa Timur</div>
                  <div class="kop-2">SMA NEGERI 1 WONGSOREJO</div>
                  <div class="kop-3">KARTU LOGIN UJIAN CBT</div>
                </div>
              </div>
              
              <div class="kartu-body">
                <table>
                  <tr><td>Nama Siswa</td><td>:</td><td>${namaTampil}</td></tr>
                  <tr><td>Kelas / Jurusan</td><td>:</td><td>${siswa.kelas}</td></tr>
                  <tr><td>USER (NIS)</td><td>:</td><td>${siswa.nisn}</td></tr>
                  <tr><td>PASSWORD</td><td>:</td><td><span class="box-password">${siswa.password}</span></td></tr>
                </table>
              </div>

              <div class="catatan">
                *Bawa kartu ini selama ujian berlangsung. Jangan sampai hilang.
              </div>
            </div>
          `;
          pageDiv.innerHTML += kartuHTML;
        });

        printArea.appendChild(pageDiv);
      });
    }
  </script>
</body>
</html>
